<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Própria História - Multiverso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0f;
            color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            color: #d4af37;
            margin-bottom: 10px;
        }

        header p {
            color: #888;
            font-size: 1rem;
        }

        #feed-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .story-container {
            max-width: 600px;
            width: 100%;
            background: #14141c;
            border: 1px solid #2a2a38;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 40px;
        }

        .video-box {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
        }

        .video-box video {
            width: 100%;
            max-height: 700px;
            object-fit: contain;
        }

        .story-content {
            padding: 25px;
            text-align: center;
        }

        .story-content h2 {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .story-content blockquote {
            font-style: italic;
            color: #d4af37;
            font-size: 1.1rem;
            line-height: 1.6;
            border-left: 3px solid #d4af37;
            padding-left: 15px;
            margin: 20px 0;
            text-align: left;
        }
    </style>
</head>
<body>

    <header>
        <h1>QUATRO MUNDOS, UM SÓ AMOR</h1>
        <p>Em um mundo de aparências, escolhemos ser reais.</p>
    </header>

    <!-- Onde os vídeos vão aparecer -->
    <div id="feed-container"></div>

    <script>
        // Lê o arquivo JSON e monta a página automaticamente
        fetch('videos.json')
            .then(response => response.json())
            .then(videos => {
                const container = document.getElementById('feed-container');
                
                videos.forEach(item => {
                    const storyDiv = document.createElement('div');
                    storyDiv.className = 'story-container';
                    
                    storyDiv.innerHTML = `
                        <div class="video-box">
                            <video controls loop playsinline>
                                <source src="${item.src}" type="video/mp4">
                                Seu navegador não suporta vídeos.
                            </video>
                        </div>
                        <div class="story-content">
                            <h2>${item.titulo}</h2>
                            <blockquote>"${item.citacao}"</blockquote>
                            <p>${item.descricao}</p>
                        </div>
                    `;
                    
                    container.appendChild(storyDiv);
                });
            })
            .catch(error => console.error('Erro ao carregar os vídeos:', error));
    </script>

</body>
</html>
