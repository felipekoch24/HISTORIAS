<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOVE RAY ❤️</title>

    <!-- Configurações para transformar em "App" no iPhone (Safari) -->
    <link rel="apple-touch-icon" href="icone.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LOVE RAY">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0f;
            color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeIn 1.5s ease-in-out;
        }

        header h1 {
            font-size: 1.7rem;
            letter-spacing: 2px;
            color: #d4af37;
            margin-bottom: 10px;
        }

        header p {
            color: #aaa;
            font-size: 0.9rem;
            padding: 0 10px;
        }

        #feed-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .story-container {
            max-width: 500px;
            width: 100%;
            background: #14141c;
            border: 1px solid #2a2a38;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 30px;
            animation: slideUp 0.8s ease-out;
        }

        .video-box {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .video-box video {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
            display: block;
        }

        .story-content {
            padding: 20px;
            text-align: center;
        }

        .story-content h2 {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .story-content blockquote {
            font-style: italic;
            color: #d4af37;
            font-size: 1rem;
            line-height: 1.5;
            border-left: 3px solid #d4af37;
            padding-left: 12px;
            margin: 15px 0;
            text-align: left;
        }

        .story-content p {
            color: #ccc;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .like-btn {
            background: transparent;
            border: 2px solid #d4af37;
            color: #d4af37;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .like-btn:hover, .like-btn.liked {
            background: #d4af37;
            color: #0b0b0f;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>QUATRO MUNDOS, UM SÓ AMOR</h1>
        <p>Em um mundo de aparências, escolhemos ser reais. Feito para você, Rayssa ❤️</p>
    </header>

    <!-- Onde os vídeos vão aparecer dinamicamente -->
    <div id="feed-container"></div>

    <script>
        fetch('videos.json')
            .then(response => response.json())
            .then(videos => {
                const container = document.getElementById('feed-container');
                
                videos.forEach(item => {
                    const storyDiv = document.createElement('div');
                    storyDiv.className = 'story-container';
                    
                    storyDiv.innerHTML = `
                        <div class="video-box">
                            <video controls loop playsinline preload="metadata">
                                <source src="${item.src}" type="video/mp4">
                                Seu navegador não suporta vídeos.
                            </video>
                        </div>
                        <div class="story-content">
                            <h2>${item.titulo}</h2>
                            <blockquote>"${item.citacao}"</blockquote>
                            <p>${item.descricao}</p>
                            <button class="like-btn" onclick="toggleLike(this)">
                                <span>❤️</span> Curtir
                            </button>
                        </div>
                    `;
                    
                    container.appendChild(storyDiv);
                });

                // Tocar apenas um vídeo por vez e manter em loop infinito
                const allVideos = document.querySelectorAll('video');
                allVideos.forEach(video => {
                    video.addEventListener('play', () => {
                        allVideos.forEach(otherVideo => {
                            if (otherVideo !== video) {
                                otherVideo.pause();
                            }
                        });
                    });
                });
            })
            .catch(error => console.error('Erro ao carregar os vídeos:', error));

        function toggleLike(btn) {
            btn.classList.toggle('liked');
            if (btn.classList.contains('liked')) {
                btn.innerHTML = '<span>❤️</span> Te amo!';
            } else {
                btn.innerHTML = '<span>❤️</span> Curtir';
            }
        }
    </script>

</body>
</html>
